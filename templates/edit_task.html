<!DOCTYPE html>
<html>
<head>
    <title>Edit Task</title>
    <link rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<h1>Edit Task</h1>

<form action="/update-task/{{ task[0] }}" method="POST">

    <input
        type="text"
        name="title"
        value="{{ task[2] }}"
        required>

    <button type="submit">
        Save Changes
    </button>

</form>

<br>

<a href="/dashboard">Back</a>

</body>
</html>
